[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[project]
name = "bwrapped"
version = "0.1.0"
description = "Bubblewrap helper with sane defaults"
readme = "README.md"
requires-python = ">=3.14"
scripts = { bwrapped = "bwrapped:main" }
dependencies = ["xdg-base-dirs~=6.0"]
